{% extends 'base.html' %}
{% block content %}
<div class="container mt-5">
    <h3>¿Estás seguro que deseas eliminar esta ruta?</h3>
    <p>{{ ruta.origen }} → {{ ruta.sitio_llegada }} | {{ ruta.fecha }} {{ ruta.hora_salida }}</p>

    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Sí, eliminar</button>
        <a href="{% url 'panel' %}" class="btn btn-secondary">Cancelar</a>
    </form>
</div>
{% endblock %}
